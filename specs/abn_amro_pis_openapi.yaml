openapi: 3.0.1
info:
  version: 2.1.4
  title: Payment Initiation (PSD2)
  x-apiType: open
  description: |-

    The Payment Initiation (PSD2) API is used by Third Party Payment service providers (TPPs) to initiate payments from ABN AMRO accounts. 
    A payment can only be initiated from an account when an ABN AMRO client authorizes the payment through the consent application.

    Use this API to initiate:

    **Single payments:**
      - SEPA payments
      - Cross-border payments

     > **Note:** Support of the V1 version of the Single SEPA Credit Transfer as well as the Cross-Border endpoint in the Payment Initiation API (PSD2) will end on the 1st of July 2026. After this date the endpoints are no longer supported and will be de-activated. Batch Payment and Standing Order endpoints will remain available in the V1 version after this date.
    For Standing Orders or Bulk payments, please see [version 1 of the PSD2 PIS API](/api-products/payment-initiation-psd2-v1/reference-documentation).
 
    See more information on how to use this API in [Tutorial](/api-products/payment-initiation-psd2/tutorial).
    
    Get more details about recent updates of this API in [Release notes](/api-products/payment-initiation-psd2/release-notes).
    
servers:
  - url: "https://api-sandbox.abnamro.com/payment/v2"
    description: sandbox environment
  - url: "https://api.abnamro.com/payment/v2"
    description: production environment

security:
  - Authorization: []
    Gen_ApiKey: []

paths:
  /sepa-credit-transfers:
    post:
      description: |-
        Registers a (structured) SEPA payment at the bank. Before it can be executed, this payment must be authorized by the account holder through the consent application.

        Use client credentials to get an `access_token` with scope `psd2:payment:sepa:write` for this operation.

      operationId: postSEPAPayment
      tags:
        - Single payments
      parameters:
        - name: Authorization
          in: header
          description: |-
            Client credentials 'access-token' to be passed as a bearer token.
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PostSEPAPaymentRequestBody"
                - $ref: "#/components/schemas/PostSEPAPaymentStructuredRequestBody"

            examples:
              "Unstructured SEPA Payment":
                $ref: "#/components/examples/PostSEPAPaymentRequestBody_Example"
              "Structured SEPA Payment":
                $ref: "#/components/examples/PostSEPAPaymentStructuredRequestBody_Example"
        required: true
      responses:
        "201":
          description: |-
            **Payment Registered**
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponseBody"
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        "400":
          $ref: "#/components/responses/400_post"
        "401":
          $ref: "#/components/responses/401_post"
        "403":
          $ref: "#/components/responses/403_post"
        "500":
          $ref: "#/components/responses/500_INT_SER_ERROR"
      security:
        - Oauth_ClientCredentials: ["psd2:payment:sepa:write"]
          Gen_ApiKey: []

  /sepa-credit-transfers/{paymentId}:
    put:
      description: |-
        Executes a registered SEPA payment at the bank for further processing. To obtain an `access_token` and execute the payment, it must be authorized by the account holder through the consent application.

        Use the authorization code process to get an `access_token` with `scope psd2:payment:sepa:write` for this operation. The authorization for executing a SEPA payment can also be used to cancel a SEPA payment.

      operationId: putSEPAPayment
      tags:
        - Single payments
      parameters:
        - name: Authorization
          in: header
          description: |-
            Authorization code `access_token`, to be passed as a bearer token
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: paymentId
          in: path
          description: |-
            Unique Payment ID returned in response to the [POST payments](#operation/postSEPAPayment) operation. This must be released for further processing with the bank.
          required: true
          schema:
            type: string
            example: 8325P3346070108S0PD
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5

      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutResponseBody"
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        "400":
          $ref: "#/components/responses/400_put"
        "401":
          $ref: "#/components/responses/401_put"
        "403":
          $ref: "#/components/responses/403_put"
        "404":
          $ref: "#/components/responses/404_NOT_FOUND"
        "500":
          $ref: "#/components/responses/500_INT_SER_ERROR"
      security:
        - Oauth_AuthorizationCode: ["psd2:payment:sepa:write"]
          Gen_ApiKey: []

    delete:
      description: |-
        Cancels a payment scheduled at a future date and has a status of 'SCHEDULED'. If the future date has passed, the payment can no longer be cancelled.
      operationId: deleteSEPAPayment
      tags:
        - Single payments
      parameters:
        - name: Authorization
          in: header
          description: |-
            Authorization code `access_token`, to be passed as a bearer token. The authorization for executing a SEPA payment can also be used to cancel a SEPA payment.
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: paymentId
          in: path
          description: |-
            Unique payment ID of the payment that is to be cancelled at the bank. The payment ID is returned in response to the [POST payments](#operation/postSEPAPayment) operation.
          required: true
          schema:
            type: string
            example: 8325P3346070108S0PD

        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      responses:
        "204":
          description: Successful operation, no content in response.
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        "400":
          $ref: "#/components/responses/400_delete"
        "401":
          $ref: "#/components/responses/401_delete"
        "403":
          $ref: "#/components/responses/403_delete"
        "404":
          $ref: "#/components/responses/404_NOT_FOUND"
        "500":
          $ref: "#/components/responses/500_INT_SER_ERROR"
      security:
        - Oauth_AuthorizationCode: ["psd2:payment:sepa:write"]
          Gen_ApiKey: []

  /sepa-credit-transfers/{paymentId}/status:
    get:
      description: |-
        Retrieves the status of a payment.

        The status of a payment can be retrieved with an `access_token` if the payment has not yet been executed, or else, with an `access_token` obtained via the authorization code exchange. The token needs to have the `psd2:payment:sepa:read` scope.

      operationId: getSEPAPayment
      tags:
        - Single payments
      parameters:
        - name: Authorization
          in: header
          description: |-
            Retrieves the status of a payment.
            For this operation, use the authorization code process to get an `access_token` with `scope psd2:payment:sepa:read`.
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: paymentId
          in: path
          description: |-
            Unique payment ID of the payment for which the status must be checked. The payment ID is returned in response from [POST payments](#operation/postSEPAPayment).
            >**Note:** Only the payment status of paymentIds which have a POST or PUT operation in the V2 version of this API can be retrieved with this V2 status endpoint.

          required: true
          schema:
            type: string
            example: 8325P3346070108S0PD

        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      responses:
        "200":
          description: |-
            **successful operation**
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetResponseBody"
              examples:
                "Settled":
                  $ref: "#/components/examples/GetSEPAPayment_Example_Settled"
                "Rejected":
                  $ref: "#/components/examples/GetSEPAPayment_Example_Rejected"
        "401":
          $ref: "#/components/responses/401_get"
        "403":
          $ref: "#/components/responses/403_get"
        "404":
          $ref: "#/components/responses/404_NOT_FOUND"
        "500":
          $ref: "#/components/responses/500_INT_SER_ERROR"
      security:
        - Oauth_AuthorizationCode: ["psd2:payment:sepa:read"]
          Gen_ApiKey: []

  /cross-border-credit-transfers:
    post:
      description: |-
        Registers a cross-border payment at the bank. This payment must be authorized by the account holder through the consent application before it can be executed. This is a non EUR payment or EUR payment outside the euro zone.
        For this operation, use client credentials to get an `access_token` with scope `psd2:payment:xborder:write`. For more information on authorization and on how to register a cross-border payment, see [Single payments tutorial](/api-products/payment-initiation-psd2/tutorial#single-payments-tutorial)        
        These types of payments are subject to SWIFT characterset limitations and possible truncation of fields. For more information, see Generic information.
      operationId: postCrossBorderPayment
      tags:
        -  Single payments
      parameters:
        - name: Authorization
          in: header
          description: |-
            Client credentials 'access-token' to be passed as a bearer token.
            
            For more information, See the Step 1 of the [Single payments tutorial](/api-products/payment-initiation-psd2/tutorial#single-payments-tutorial)
          required: true
          schema:
            type: string
            example: Bearer X1PTWZre0fnW72l263yrhAWB2FDwx3tg
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCBPaymentRequestBody'
            examples:
              "Using IBAN with bankdetails":
                $ref: '#/components/examples/PostCBPaymentRequestBody_UsingIBAN'
              "Using BBAN with bankdetails":
                $ref: '#/components/examples/PostCBPaymentRequestBody_UsingBBAN'
        required: true
      responses:
        '201':
          description: |-
            **Payment Registered**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseBody'
          headers:
            'X-Request-ID':
              $ref: '#/components/headers/xRequestId'
            'Trace-Id':
              $ref: '#/components/headers/traceId'
        '400':
          $ref: '#/components/responses/400_POST_Single_CB_Payment'
        '401':
          $ref: '#/components/responses/401_post_CB'
        '403':
          $ref: '#/components/responses/403_post_CB'
        '500':
          $ref: '#/components/responses/500_INT_SER_ERROR'
      security:
        - Oauth_ClientCredentials: [ 'psd2:payment:xborder:write' ]
          Gen_ApiKey: [ ]

  /cross-border-credit-transfers/{paymentId}:
    put:
      description: |-
        Executes a registered Cross Border payment at the bank for further processing. To obtain an `auth_token` and execute the payment, it must be authorized by the account holder through the consent application.
        Use the authorization code process to get an `auth_token` with `psd2:payment:xborder:write` for this operation. The authorization for executing a Cross Border payment can also be used to cancel a Cross Border payment.
        For more information, see Step 3 and Step 6 of the [Single payments tutorial](/api-products/payment-initiation-psd2/tutorial#single-payments-tutorial).
      operationId: putCrossBorderPayment
      tags:
        -  Single payments
      parameters:
        - name: paymentId
          in: path
          description: |-
            Unique Payment ID returned in response to the [POST payments](#operation/postCrossBorderPayment) operation. This must be released for further processing with the bank.
          required: true
          schema:
            type: string
            example: 7325P7746070509S0PD
        - name: Authorization
          in: header
          description: |-
            Authorization code `auth_token`, to be passed as a bearer token.
            For more information, see Step 3 and Step 6 of the [Single payments tutorial](/api-products/payment-initiation-psd2/tutorial#single-payments-tutorial).
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutResponseBody'
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        '400':
          $ref: '#/components/responses/400_put'
        '401':
          $ref: '#/components/responses/401_put_CB'
        '403':
          $ref: '#/components/responses/403_put_CB'
        '404':
          $ref: '#/components/responses/404_NOT_FOUND'
        '500':
          $ref: '#/components/responses/500_INT_SER_ERROR'
      security:
        - Oauth_AuthorizationCode: [ 'psd2:payment:xborder:write' ]
          Gen_ApiKey: [ ]


    delete:
      description: |-
        Cancels a payment scheduled at a future date and has a status of 'PDNG'. If the future date has passed, the payment can no longer be cancelled. 
        Use the authorization code process to get an `auth_token` with `psd2:payment:xborder:write` for this operation. The authorization for executing a Cross Border payment can also be used to cancel a Cross Border payment.
      operationId: deleteCrossBorderPayment
      tags:
        -  Single payments
      parameters:
        - name: paymentId
          in: path
          description: |-
            Unique payment ID of the payment that is to be cancelled at the bank. The payment ID is returned in response to the [POST payments](#operation/postCrossBorderPayment) operation.
          required: true
          schema:
            type: string
            example: 7325P7746070509S0PD
        - name: Authorization
          in: header
          description: |-
            Authorization code `auth_token`, to be passed as a bearer token. The authorization for executing a SEPA payment can also be used to cancel a SEPA payment.
            
            For more information, see Step 3 of the [Single payments tutorial](#section/Tutorials/Single-payments-tutorial).
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      responses:
        '204':
          description: Successful operation, no content in response.
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        '400':
          $ref: '#/components/responses/400_delete'
        '401':
          $ref: '#/components/responses/401_delete_CB'
        '403':
          $ref: '#/components/responses/403_delete_CB'
        '404':
          $ref: '#/components/responses/404_NOT_FOUND'
        '500':
          $ref: '#/components/responses/500_INT_SER_ERROR'
      security:
        - Oauth_AuthorizationCode: [ 'psd2:payment:xborder:write' ]
          Gen_ApiKey: [ ]

  /cross-border-credit-transfers/{paymentId}/status:
    get:
      description: |-
        Retrieves the status of a payment.
        For this operation, use the authorization code process to get an `access_token` with `scope psd2:payment:xborder:read`.
        For more information, see Step 3 and Step 6 of the [Single payments tutorial](#section/Tutorials/Single-payments-tutorial).
      operationId: getCrossBorderPayment
      tags:
        -  Single payments
      parameters:
        - name: paymentId
          in: path
          description: |-
            Unique payment ID of the payment for which the status must be checked. The payment ID is returned in response from [POST payments](#operation/postCrossBorderPayment).
            >**Note:** Only the payment status of paymentIds which have a POST or PUT operation in the V2 version of this API can be retrieved with this V2 status endpoint.

          required: true
          schema:
            type: string
            example: 7325P7746070509S0PD
        - name: Authorization
          in: header
          description: |-
            Authorization code `auth_token`, to be passed as a bearer token. For more information, see [Single payments tutorial ](#section/Tutorials/Single-payments-tutorial).
          required: true
          schema:
            type: string
            example: Bearer GPgYglX4sO1WhzfChx4tmjr4y7Qg
        - name: X-Request-ID
          in: header
          description: |-
            Unique trace ID generated by the API consumer application. This is used to correlate
            calls from the client application to ABN AMRO, and help when troubleshooting technical errors.
          required: false
          schema:
            type: string
            example: bc69c490-9524-413f-971a-21f1aecd9fe5
      responses:
        '200':
          description: |-
            **successful operation**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseBody'
          headers:
            "X-Request-ID":
              $ref: "#/components/headers/xRequestId"
            "Trace-Id":
              $ref: "#/components/headers/traceId"
        '401':
          $ref: '#/components/responses/401_get_CB'
        '403':
          $ref: '#/components/responses/403_get_CB'
        '404':
          $ref: '#/components/responses/404_NOT_FOUND'
        '500':
          $ref: '#/components/responses/500_INT_SER_ERROR'
      security:
        - Oauth_AuthorizationCode: [ 'psd2:payment:xborder:read' ]
          Gen_ApiKey: [ ]

components:
  securitySchemes:
    Oauth_AuthorizationCode:
      type: oauth2
       
      description: |-
        Authorization code `access_token`, to be passed as a bearer token.
      flows:
        authorizationCode:
          authorizationUrl: 'https://auth-sandbox.abnamro.com/as/authorization.oauth2'
          tokenUrl: 'https://auth-mtls-sandbox.abnamro.com/as/token.oauth2'
          scopes:
            psd2:payment:sepa:write: Releases a SEPA payment after authorization
              by the account holder. Also a scheduled SEPA payment can be cancelled using this scope.
              You get this scope through consent from the account holder.
            psd2:payment:sepa:read: Requests the status of a SEPA payment. You get
              this scope through consent from the account holder.

    Oauth_ClientCredentials:
      type: oauth2

      description: |-
        Client Credentials `access_token`, to be passed as a bearer token.
      flows:
        clientCredentials:
          tokenUrl: https://auth-mtls-sandbox.abnamro.com/as/token.oauth2
          scopes:
            psd2:payment:sepa:write: Registers a SEPA payment for authorization.

    Gen_ApiKey:
      type: apiKey
      in: header
      name: API-Key
      description: Consumer key obtained after application registration on the developer portal.
    Authorization:
      type: http
      scheme: bearer
      description: >-
        Authorization code `access_token`, to be passed as a bearer token

  schemas:
    PostSEPAPaymentRequestBody:
      required:
        - creditorAccount
        - creditorName
        - instructedAmount
      type: object
      properties:
        debtorAccount:
          type: object
          properties:
            iban:
              maxLength: 34
              type: string
              description: |-
                The IBAN of the ordering party initiating
                the transaction. If omitted, the account number will be selected during
                the authorization of the payment. If the account cannot be authorized,
                the account holder can select a different account. Cannot be
                the same as the creditor's IBAN.
              example: NL62ABNA9999841479
              pattern: >
                "^[A-Z]{2}[0-9]{2}[a-zA-Z0-9]{1,30}$"
        creditorAccount:
          type: object
          required:
            - iban
          properties:
            iban:
              maxLength: 34
              type: string
              description: |-
                Account number, in IBAN format, of the counterparty.
              example: NL12ABNA9999876523
              pattern: >
                "^[A-Z]{2}[0-9]{2}[a-zA-Z0-9]{1,30}$"
        creditorName:
          maxLength: 70
          type: string
          description: Name of the counterparty.
          example: John Doe
          pattern: >
            "^[0-9A-Za-z !&'()+\-./:?_`,àÀáÁâÂãÃäÄåÅæÆçÇèÈéÉêÊëËìÌíÍîÎïÏðÐñÑòÒóÓôÔõÕöÖ×øØùÙúÚûÛüÜýÝþÞßÿ]+$"
        instructedAmount:
          required:
            - amount
          type: object
          properties:
            amount:
              type: number
              description: |-
                Amount of the transaction. This value is always positive with at most two digits after the decimal point. The maximum amount is equal to that set for the online
                banking channel Access Online or Internet Banking.
              format: float
              example: 100.01
              minimum: 0.01
              exclusiveMinimum: true
            currency:
              type: string
              description:
                The currency of the transaction, in EUR only. If omitted,
                EUR is assumed.
              enum:
                - EUR
        requestedExecutionDate:
          type: string
          description: |-
            Optional date on which the payment is to be executed. This date should not be in the past and should be no more than one year
            after the current date. If the requested execution date is empty
            then the payment will be executed immediately.  The format of the date is a ISO8601 full-date conforming
            to RFC 3339, (CCYY-MM-DD). If there is no clearing of payments on the execution date, the payment will
            be processed on the first available bookdate.
          format: date
        remittanceInformationUnstructured:
          maxLength: 140
          type: string
          description: Information for the beneficiary about the payment. This type of information is 'unstructured'. A maximum of 140 characters is allowed.
          example: Payment of invoice nr 12345/01.
          pattern: >
            "^[0-9A-Za-z !&'()+\-./:?_`,àÀáÁâÂãÃäÄåÅæÆçÇèÈéÉêÊëËìÌíÍîÎïÏðÐñÑòÒóÓôÔõÕöÖ×øØùÙúÚûÛüÜýÝþÞßÿ]+$"

    PostSEPAPaymentStructuredRequestBody:
      required:
        - creditorAccount
        - creditorName
        - instructedAmount
      type: object
      properties:
        debtorAccount:
          type: object
          properties:
            iban:
              maxLength: 34
              type: string
              description: |-
                The IBAN of the ordering party initiating
                the transaction. If omitted, the account number will be selected during
                the authorization of the payment. If the account cannot be authorized,
                the account holder can select a different account. Cannot be
                the same as the creditor's IBAN.
              example: NL62ABNA9999841479
              pattern: >
                "^[A-Z]{2}[0-9]{2}[a-zA-Z0-9]{1,30}$"
        creditorAccount:
          type: object
          required:
            - iban
          properties:
            iban:
              maxLength: 34
              type: string
              description: |-
                Account number, in IBAN format, of the counterparty.
              example: NL12ABNA9999876523
              pattern: >
                "^[0-9A-Z]+$"
        creditorName:
          maxLength: 70
          type: string
          description: Name of the counterparty.
          example: John Doe
          pattern: >
