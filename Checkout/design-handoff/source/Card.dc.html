<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hosted checkout card details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/cm-com/colors_and_type.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#344055;text-decoration:underline;text-underline-offset:3px}
a:hover{color:#101E1E}
a:focus-visible{outline:2px solid #007FFF;outline-offset:3px;border-radius:4px}
.fld{width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1.5px solid #E6E8EB;border-radius:10px;font:500 15px/1 var(--font-body);color:#101E1E;background:#FFFFFF;transition:border-color 200ms cubic-bezier(0.22,1,0.36,1),box-shadow 200ms cubic-bezier(0.22,1,0.36,1)}
.fld::placeholder{color:#5A6372;opacity:1}
.fld:focus{outline:none;border-color:#007FFF;box-shadow:0 0 0 3px rgba(0,127,255,0.18)}
.fld-err{border-color:#E5484D}
.fld-err:focus{border-color:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,0.18)}
.c2p{transition:box-shadow 200ms cubic-bezier(0.22,1,0.36,1)}
.c2p:hover{box-shadow:0 6px 18px rgba(16,30,30,0.08)}
.c2p:focus-visible{outline:2px solid #007FFF;outline-offset:2px}
.pay{transition:filter 200ms cubic-bezier(0.22,1,0.36,1)}
.pay:not(:disabled):hover{filter:brightness(1.08)}
.pay:focus-visible{outline:2px solid #007FFF;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.flip-inner{transition:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 56px 24px; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); color: var(--fg-1); background: radial-gradient(900px 600px at 12% 8%, rgba(102,16,242,0.07), transparent 60%), radial-gradient(800px 600px at 92% 94%, rgba(0,127,255,0.08), transparent 60%), #F7F7F9;">

<main style="width: 100%; max-width: 480px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; overflow: hidden; padding: 40px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 2px 4px rgba(16,30,30,0.04), 0 12px 28px rgba(16,30,30,0.07), 0 40px 80px rgba(16,30,30,0.08);">
<a href="https://amnesia.es" aria-label="Back to Amnesia Ibiza" title="Placeholder: production uses the merchant return/cancel URL" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #344055; text-decoration: none; margin: -12px 0 -12px -4px;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
<span>Back</span>
</a>

<header style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 16px; text-align: left;">
<div role="img" aria-label="Amnesia Ibiza logo" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; overflow: hidden; display: flex; box-shadow: 0 0 0 1px rgba(16,30,30,0.06);">
<img src="/_blob/c8d3ff6fefd82a9616a8559251a0c48e" alt="" style="width: 48px; height: 48px; object-fit: cover; display: block;">
</div>
<h1 style="margin: 0; min-width: 0; font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere;">Amnesia Ibiza</h1>
</header>
<div style="display: flex; justify-content: center; gap: 8px; margin: -8px 0 0; font-size: 13px; font-weight: 500; color: #5A6372;"><span>Date</span><span style="font-weight: 600; color: var(--fg-1);">7 November 2026, 14:32</span></div>

<div style="width: 100%; max-width: 380px; margin: 0 auto; aspect-ratio: 1.586; perspective: 1000px;" aria-hidden="true">
<div class="flip-inner" style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 600ms cubic-bezier(0.22,1,0.36,1); transform: {{flipTransform}};">

<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 22px 24px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; background: {{cardBg}}; color: #FFFFFF; box-shadow: 0 18px 36px rgba(16,30,30,0.22); backface-visibility: hidden; -webkit-backface-visibility: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px;">
<svg width="44" height="32" viewBox="0 0 44 32" aria-hidden="true"><rect width="44" height="32" rx="6" fill="#E8C96A"></rect><path d="M0 11h44M0 21h44M15 0v32M29 0v32" stroke="#B8963B" stroke-width="1.5" fill="none"></path><rect x="15" y="11" width="14" height="10" rx="2" fill="#E8C96A" stroke="#B8963B" stroke-width="1.5"></rect></svg>
<sc-if value="{{hasBrand}}" hint-placeholder-val="{{ false }}">
<span style="width: 64px; height: 40px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
<img src="{{brandLogo}}" alt="" style="width: 40px; height: 40px; object-fit: contain;">
</span>
</sc-if>
</div>
<div style="font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; background: {{hlNumber}}; opacity: {{numberOpacity}}; transition: background 200ms; white-space: nowrap; overflow: hidden;">{{numberDisplay}}</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="min-width: 0; padding: 4px 8px; margin: -4px -8px; border-radius: 6px; background: {{hlName}}; transition: background 200ms;">
<div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.85);">CARDHOLDER</div>
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; opacity: {{nameOpacity}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{nameDisplay}}</div>
</div>
<div style="flex-shrink: 0; padding: 4px 8px; margin: -4px -8px; border-radius: 6px; background: {{hlExpiry}}; transition: background 200ms;">
<div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.85);">EXPIRES</div>
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; opacity: {{expiryOpacity}};">{{expiryDisplay}}</div>
</div>
</div>
</div>

<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 22px 0; border-radius: 16px; display: flex; flex-direction: column; gap: 18px; background: {{cardBg}}; color: #FFFFFF; box-shadow: 0 18px 36px rgba(16,30,30,0.22); transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden;">
<div style="height: 44px; background: #101E1E; margin-top: 6px;"></div>
<div style="padding: 0 24px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
<div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.85);">SECURITY CODE</div>
<div style="width: 100%; box-sizing: border-box; height: 40px; border-radius: 6px; background: #FFFFFF; color: #101E1E; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; font-variant-numeric: tabular-nums;">{{cvcDisplay}}</div>
</div>
</div>

</div>
</div>

<button type="button" class="c2p" aria-label="Click to Pay" style="width: 100%; height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; background: #FFFFFF; border: 1.5px solid #DADCE0; border-radius: 10px; cursor: pointer;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 5h16l10 11-10 11H3z" fill="#101E1E"></path><path d="M11 11l5 5-5 5M17 11l5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="width: 1px; height: 28px; background: #C9CDD3; flex-shrink: 0;"></span>
<img src="/_blob/37a841665210cb936e24d46c48659d84" alt="" style="width: 28px; height: 28px; object-fit: contain;">
<img src="/_blob/d63dea3b9b024d206737b65d39c2c67d" alt="" style="width: 28px; height: 28px; object-fit: contain;">
<img src="/_blob/2815efafc9c1b1288a9ef6ffa742e09f" alt="" style="width: 28px; height: 28px; object-fit: contain;">
</button>
<div style="display: flex; align-items: center; gap: 12px; color: #5A6372; font-size: 12px; font-weight: 500; margin: -4px 0;">
<span style="flex-grow: 1; height: 1px; background: #E6E8EB;"></span>
<span>Or enter card details</span>
<span style="flex-grow: 1; height: 1px; background: #E6E8EB;"></span>
</div>

<form style="display: flex; flex-direction: column; gap: 16px;" onSubmit="{{onSubmit}}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cc-number" style="font-size: 13px; font-weight: 600; color: #344055;">Card number</label>
<input id="cc-number" class="fld {{numberClass}}" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" value="{{number}}" onInput="{{onNumber}}" onChange="{{onNumber}}" onFocus="{{focusNumber}}" onBlur="{{blurAny}}">
<sc-if value="{{numberError}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 500; color: #B42318;">Check your card number and try again.</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cc-name" style="font-size: 13px; font-weight: 600; color: #344055;">Name on card</label>
<input id="cc-name" class="fld" type="text" autocomplete="cc-name" placeholder="Full name" value="{{name}}" onInput="{{onName}}" onChange="{{onName}}" onFocus="{{focusName}}" onBlur="{{blurAny}}">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cc-exp" style="font-size: 13px; font-weight: 600; color: #344055;">Expiry date</label>
<input id="cc-exp" class="fld {{expiryClass}}" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" value="{{expiry}}" onInput="{{onExpiry}}" onChange="{{onExpiry}}" onFocus="{{focusExpiry}}" onBlur="{{blurAny}}">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cc-cvc" style="font-size: 13px; font-weight: 600; color: #344055;">Security code</label>
<input id="cc-cvc" class="fld" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="{{cvcPlaceholder}}" value="{{cvc}}" onInput="{{onCvc}}" onChange="{{onCvc}}" onFocus="{{focusCvc}}" onBlur="{{blurAny}}">
</div>
</div>
<sc-if value="{{expiryError}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 500; color: #B42318; margin-top: -8px;">This card has expired or the date is not valid.</span>
</sc-if>
<button type="submit" class="pay" disabled="{{payDisabled}}" style="height: 52px; border: 0; border-radius: 10px; padding: 0 20px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; background: {{payBg}}; opacity: {{payOpacity}}; cursor: {{payCursor}};">{{payLabel}}</button>
</form>

<footer style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 -40px -40px; padding: 20px 40px; background: #2B2F36; color: #E6E8EB; font-size: 15px; font-weight: 500;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>Secured by</span>
<img src="/_blob/1dff062cf3570eb6f7af1af8b565411f" alt="CM.com" style="height: 20px; width: auto;">
</footer>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { number: '', name: '', expiry: '', cvc: '', focus: '', status: 'idle' };
  }
  renderVals() {
    const s = this.state;
    const digitsOf = (v) => String(v).replace(/\D/g, '');
    const detect = (d) => {
      if (/^4/.test(d)) return 'visa';
      if (/^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(d)) return 'mastercard';
      if (/^3[47]/.test(d)) return 'amex';
      return '';
    };
    const groupsFor = (brand) => (brand === 'amex' ? [4, 6, 5] : [4, 4, 4, 4]);
    const formatNumber = (d, brand) => {
      const out = [];
      let i = 0;
      groupsFor(brand).forEach((g) => {
        if (i < d.length) out.push(d.slice(i, i + g));
        i += g;
      });
      return out.join(' ');
    };
    const luhn = (d) => {
      let sum = 0;
      let alt = false;
      for (let i = d.length - 1; i >= 0; i--) {
        let n = Number(d[i]);
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        sum += n;
        alt = !alt;
      }
      return d.length > 0 && sum % 10 === 0;
    };

    const digits = digitsOf(s.number);
    const brand = detect(digits);
    const maxLen = brand === 'amex' ? 15 : 16;
    const cvcLen = brand === 'amex' ? 4 : 3;
    const numberComplete = digits.length === maxLen;
    const numberOk = numberComplete && luhn(digits);

    const expDigits = digitsOf(s.expiry);
    let expiryOk = false;
    let expiryComplete = expDigits.length === 4;
    if (expiryComplete) {
      const m = Number(expDigits.slice(0, 2));
      const y = 2000 + Number(expDigits.slice(2));
      const now = new Date();
      expiryOk = m >= 1 && m <= 12 && (y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth() + 1));
    }
    const nameOk = s.name.trim().length > 1;
    const cvcOk = s.cvc.length === cvcLen;
    const canPay = numberOk && expiryOk && nameOk && cvcOk;

    // Card face text
    const shown = groupsFor(brand).map((g, gi) => {
      const start = groupsFor(brand).slice(0, gi).reduce((a, b) => a + b, 0);
      const part = digits.slice(start, start + g);
      return part + '•'.repeat(g - part.length);
    }).join(' ');

    const logos = {
      visa: '/_blob/37a841665210cb936e24d46c48659d84',
      mastercard: '/_blob/d63dea3b9b024d206737b65d39c2c67d',
      amex: '/_blob/2815efafc9c1b1288a9ef6ffa742e09f'
    };
    const bgs = {
      '': 'linear-gradient(135deg, #4C14B1 0%, #0562BB 100%)',
      visa: 'linear-gradient(135deg, #0D314B 0%, #0562BB 100%)',
      mastercard: 'linear-gradient(135deg, #212E39 0%, #4C14B1 100%)',
      amex: 'linear-gradient(135deg, #0A4F5C 0%, #0C6B7A 100%)'
    };
    const hl = 'rgba(255,255,255,0.2)';

    const payLabel = s.status === 'paying' ? 'Processing…' : s.status === 'done' ? 'Payment complete' : 'Pay € 65,00';
    const payDisabled = !canPay || s.status !== 'idle';

    return {
      number: s.number,
      name: s.name,
      expiry: s.expiry,
      cvc: s.cvc,
      hasBrand: !!brand,
      brandLogo: logos[brand] || '',
      cardBg: bgs[brand],
      flipTransform: s.focus === 'cvc' ? 'rotateY(180deg)' : 'rotateY(0deg)',
      numberDisplay: shown,
      numberOpacity: digits.length ? 1 : 0.7,
      nameDisplay: s.name ? s.name.toUpperCase() : 'YOUR NAME',
      nameOpacity: s.name ? 1 : 0.7,
      expiryDisplay: s.expiry || 'MM/YY',
      expiryOpacity: s.expiry ? 1 : 0.7,
      cvcDisplay: s.cvc || '•'.repeat(cvcLen),
      cvcPlaceholder: brand === 'amex' ? '4 digits' : '3 digits',
      hlNumber: s.focus === 'number' ? hl : 'transparent',
      hlName: s.focus === 'name' ? hl : 'transparent',
      hlExpiry: s.focus === 'expiry' ? hl : 'transparent',
      numberClass: numberComplete && !numberOk ? 'fld-err' : '',
      numberError: numberComplete && !numberOk,
      expiryClass: expiryComplete && !expiryOk ? 'fld-err' : '',
      expiryError: expiryComplete && !expiryOk,
      payLabel,
      payDisabled,
      payBg: s.status === 'done' ? '#1F7A4D' : 'linear-gradient(60deg, #0074E8 0%, #5D11DC 100%)',
      payOpacity: payDisabled && s.status === 'idle' ? 0.45 : 1,
      payCursor: payDisabled ? 'not-allowed' : 'pointer',

      onNumber: (e) => {
        const raw = digitsOf(e.target.value);
        const b = detect(raw);
        const d = raw.slice(0, b === 'amex' ? 15 : 16);
        this.setState({ number: formatNumber(d, b) });
      },
      onName: (e) => {
        this.setState({ name: e.target.value.replace(/[0-9]/g, '').slice(0, 26) });
      },
      onExpiry: (e) => {
        let d = digitsOf(e.target.value).slice(0, 4);
        if (d.length >= 1 && d[0] > '1') d = '0' + d;
        if (d.length >= 2 && Number(d.slice(0, 2)) > 12) d = '12' + d.slice(2);
        d = d.slice(0, 4);
        this.setState({ expiry: d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d });
      },
      onCvc: (e) => {
        this.setState({ cvc: digitsOf(e.target.value).slice(0, cvcLen) });
      },
      focusNumber: () => this.setState({ focus: 'number' }),
      focusName: () => this.setState({ focus: 'name' }),
      focusExpiry: () => this.setState({ focus: 'expiry' }),
      focusCvc: () => this.setState({ focus: 'cvc' }),
      blurAny: () => this.setState({ focus: '' }),
      onSubmit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!canPay || this.state.status !== 'idle') return;
        this.setState({ status: 'paying', focus: '' });
        setTimeout(() => this.setState({ status: 'done' }), 1400);
      }
    };
  }
}
</script>
</body>
</html>
