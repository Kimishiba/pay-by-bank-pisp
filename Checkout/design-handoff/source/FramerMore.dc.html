      { id: 'billink', name: 'Billink', desc: 'Receive your order, pay later', kind: 'ph' },
      { id: 'eps', name: 'EPS', desc: 'Pay with your Austrian bank', kind: 'ph' },
      { id: 'p24', name: 'Przelewy24', desc: 'Online payments in Poland', kind: 'logo', img: '/_blob/3c21ec1b8175ae3e8a575a49e74737d7', imgW: 34, tileBg: '#FFFFFF', tileBorder: border },
      { id: 'multibanco', name: 'Multibanco', desc: 'Pay using a payment reference', kind: 'ph' },
      { id: 'paysafecard', name: 'Paysafecard', desc: 'Pay with a prepaid code', kind: 'ph' }
    ];
    const methods = defs.map((d) => {
      const selected = this.state.picked === d.id;
      return {
        ...d,
        isCard: d.kind === 'card',
        isBank: d.kind === 'bank',
        isFill: d.kind === 'fill',
        isLogo: d.kind === 'logo',
        isPh: d.kind === 'ph',
        img: d.img || '',
        imgW: d.imgW || 28,
        tileBg: d.tileBg || '#F5F6F1',
        tileBorder: d.tileBorder || '0',
        selected,
        border: selected ? '#20221F' : '#E3E4DE',
        pick: () => this.setState({ picked: d.id })
      };
    });
    const topIds = ['card', 'bank', 'ideal', 'bancontact'];
    const top = topIds.map((id) => methods.find((m) => m.id === id));
    const rest = methods.filter((m) => !topIds.includes(m.id));
    const previews = ['klarna', 'wero', 'sofort', 'riverty', 'p24'].map((id) => {
      const m = methods.find((x) => x.id === id);
      return { img: m.img, w: 22, bg: m.tileBg === '#F5F6F1' ? '#FFFFFF' : m.tileBg, border: m.tileBorder === '0' ? '0' : m.tileBorder };
    });
    const open = this.state.more;
    return {
      top, rest, previews,
      extraLabel: '+' + (rest.length - previews.length),
      moreOpen: open,
      moreClosed: !open,
      moreChevron: open ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMore: () => this.setState({ more: !this.state.more })
    };
  }
}
</script>
